[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-it"
version = "0.1.0"
description = "AI-Powered Image Generation Application with Stable Diffusion"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Robert Sullender", email = "contact@github.com/RobertSullender"}
]
maintainers = [
    {name = "Robert Sullender", email = "contact@github.com/RobertSullender"}
]
requires-python = ">=3.9"
keywords = ["ai", "image-generation", "stable-diffusion", "pytorch", "desktop-app"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "PyQt6>=6.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "transformers>=4.35.0",
    "diffusers>=0.31.0",
    "accelerate>=0.26.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "nvidia-ml-py>=12.530.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "pytest>=7.4.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/RobertSullender/Artificial-It"
Documentation = "https://github.com/RobertSullender/Artificial-It/tree/main/docs"
Repository = "https://github.com/RobertSullender/Artificial-It.git"
Issues = "https://github.com/RobertSullender/Artificial-It/issues"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "build", "dist"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E501", "W503"]
exclude = [".venv", "build", "dist"]