[pre-commit-config-version] = "1"
repos = [
    { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        { id = "check-ast" },
        { id = "check-json" },
        { id = "check-merge-conflict" },
        { id = "check-yaml" },
        { id = "end-of-file-fixer" },
        { id = "trailing-whitespace" },
    ]},
    { repo = "https://github.com/psf/black", rev = "24.3.0", hooks = [
        { id = "black" }
    ]},
    { repo = "https://github.com/pycqa/flake8", rev = "7.0.0", hooks = [
        { id = "flake8", args = ["--max-line-length=120", "--ignore=E501,W503"] }
    ]},
]